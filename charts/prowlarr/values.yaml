# Default values for prowlarr
# Most defaults come from the common library chart
# Only override what's specific to this app

image:
  registry: ghcr.io
  repository: chillincool/prowlarr
  tag: 1.30.1.4991
  pullPolicy: IfNotPresent

# Prowlarr listens on port 9696
containerPort: 9696

service:
  type: ClusterIP
  port: 9696
  targetPort: http

# Ingress - disabled by default
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: prowlarr.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Persistence configuration
# User must configure persistence - no defaults provided
# Example:
# persistence:
#   config:
#     enabled: true
#     type: pvc
#     existingClaim: prowlarr-config
#     globalMounts:
#       - path: /config
#         subPath: prowlarr
persistence: {}

# Autoscaling - disabled by default
autoscaling:
  enabled: false

# Service account
serviceAccount:
  create: true

# Additional settings
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
env: []
envFrom: []
