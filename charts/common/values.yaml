# Default values for common library chart
# This is a library chart - values here serve as documentation
# for expected values in dependent charts

# Standard user/group ID used across containers (matches linuxserver.io convention)
# uid: 568
# gid: 568

# Test flag used by CI to trigger harmless changes for workflow testing
ciTest: true

# Timezone for containers
timezone: "UTC"

# Probe configuration
probes:
  # Health check path - most *arr apps use /ping
  path: "/ping"
  # Set to false to disable probes entirely
  enabled: true

# Default values that child charts should define:
#
# image:
#   registry: ghcr.io
#   repository: org/app
#   tag: latest
#   pullPolicy: IfNotPresent
#
# containerPort: 8080
#
# service:
#   type: ClusterIP
#   port: 80
#   targetPort: http
#
# resources: {}
#   # Omit to use common.defaultResources
#   # Or specify your own:
#   # requests:
#   #   cpu: 100m
#   #   memory: 256Mi
#   # limits:
#   #   cpu: 1
#   #   memory: 1Gi
#
# securityContext: {}
#   # Omit to use common.defaultSecurityContext
#   # Or specify your own overrides
#
# podSecurityContext: {}
# Environment variables / environment references
#
# Child charts may provide either explicit env entries or envFrom entries
# which reference ConfigMaps or Secrets. Examples:
# env:
#   - name: EXAMPLE_FLAG
#     value: "true"
#
# envFrom:
#   - configMapRef:
#       name: my-app-config
#   - secretRef:
#       name: my-app-secret
#   # Omit to use common.defaultPodSecurityContext
#   # Or specify your own overrides
#
# persistence:
#   config:
#     enabled: true
#     type: pvc  # or emptyDir
#     existingClaim: ""
#     storageClass: ""
#     size: 1Gi
#     accessMode: ReadWriteOnce
#   media:
#     enabled: false
#     existingClaim: ""
#   downloads:
#     enabled: false
#     existingClaim: ""

# Service account configuration
serviceAccount:
  create: true
  annotations: {}
  name: ""

# Deployment strategy configuration
# strategy:
#   type: RollingUpdate
#   rollingUpdate:
#     maxSurge: 1
#     maxUnavailable: 0
#
# For single-replica apps with persistent volumes, use Recreate:
# strategy:
#   type: Recreate

# Autoscaling configuration
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

# HTTPRoute configuration (Gateway API / envoy-gateway)
httpRoute:
  enabled: false
  # Gateway reference
  parentRefs:
    - name: ""
      namespace: ""
  # Hostnames this HTTPRoute should match
  hostnames: []
  # Rules for routing traffic
  rules: []
  # Example:
  # parentRefs:
  #   - name: eg
  #     namespace: envoy-gateway-system
  # hostnames:
  #   - radarr.example.com
  # rules:
  #   - matches:
  #       - path:
  #           type: PathPrefix
  #           value: /
  #     backendRefs:
  #       - name: radarr  # Will be auto-filled with service name
  #         port: 7878

# NetworkPolicy configuration
networkPolicy:
  enabled: false
  # Policy types to enforce
  policyTypes:
    - Ingress
    - Egress
  # Ingress rules
  ingress: []
  # Example:
  # - from:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: envoy-gateway-system
  #   ports:
  #   - protocol: TCP
  #     port: 7878
  # Egress rules
  egress: []
  # Example - Allow DNS and specific external services:
  # - to:
  #   - namespaceSelector:
  #       matchLabels:
  #         kubernetes.io/metadata.name: kube-system
  #   ports:
  #   - protocol: UDP
  #     port: 53
  # - to:
  #   - podSelector:
  #       matchLabels:
  #         app: prowlarr
  #   ports:
  #   - protocol: TCP
  #     port: 9696
