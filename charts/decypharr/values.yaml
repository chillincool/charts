# Default values for decypharr
replicaCount: 1

image:
  registry: ghcr.io
  repository: chillincool/decypharr
  # tag defaults to appVersion from Chart.yaml if not specified
  # For production, use a specific SHA or version tag, e.g., "sha-abc123"
  tag: 0.1.0
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 65534

securityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  readOnlyRootFilesystem: false

containerPort: 8282

service:
  type: ClusterIP
  port: 8282
  targetPort: http

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: decypharr.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: decypharr-tls
  #    hosts:
  #      - decypharr.local

resources: {}
  # limits:
  #   cpu: 1000m
  #   memory: 1Gi
  # requests:
  #   cpu: 100m
  #   memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 45
  periodSeconds: 30
  timeoutSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 15
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

# Environment variables
env: []
envFrom: []

# Persistence configuration
# User must configure persistence - no defaults provided
# Example:
# persistence:
#   config:
#     enabled: true
#     type: pvc
#     existingClaim: decypharr-config
#     globalMounts:
#       - path: /config
persistence: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Test flag used by CI to trigger harmless changes for workflow testing
ciTest: true
