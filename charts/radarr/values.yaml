# Default values for radarr
# Most defaults come from the common library chart
# Only override what's specific to this app

image:
  registry: ghcr.io
  repository: chillincool/radarr
  tag: latest
  pullPolicy: IfNotPresent

# Radarr listens on port 7878
containerPort: 7878

service:
  type: ClusterIP
  port: 7878
  targetPort: http

# Ingress - disabled by default
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: radarr.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Persistence configuration
# User must configure persistence - no defaults provided
# Example:
# persistence:
#   config:
#     enabled: true
#     type: pvc
#     existingClaim: radarr-config
#     globalMounts:
#       - path: /config
#         subPath: radarr
persistence: {}

# Autoscaling - disabled by default
autoscaling:
  enabled: false

# Service account
serviceAccount:
  create: true

# Additional settings
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
env: []
