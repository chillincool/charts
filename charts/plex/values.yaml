# Default values for plex
# Most defaults come from the common library chart
# Only override what's specific to this app

# Test flag used by CI to trigger harmless changes for workflow testing
ciTest: true

image:
  registry: ghcr.io
  repository: chillincool/plex
  tag: 1.41.3.9314-a0bfb8370
  pullPolicy: IfNotPresent

# Plex listens on port 32400
containerPort: 32400

service:
  type: ClusterIP
  port: 32400
  targetPort: http

# Plex uses /web for health checks
probes:
  path: /web

# Ingress - disabled by default
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: plex.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Resources - use streaming defaults from common
# Uncomment to override:
# resources:
#   requests:
#     cpu: 500m
#     memory: 512Mi
#   limits:
#     cpu: 4
#     memory: 4Gi

# Security contexts - omit to use common defaults (uid/gid 568)
# Uncomment to override:
# securityContext:
#   runAsUser: 1000
# podSecurityContext:
#   fsGroup: 1000

# Persistence configuration
# User must configure persistence - no defaults provided
# Example:
# persistence:
#   config:
#     enabled: true
#     type: pvc
#     existingClaim: plex-config
#     globalMounts:
#       - path: /config
#   media:
#     enabled: true
#     type: pvc
#     existingClaim: media-storage
#     globalMounts:
#       - path: /media
#         readOnly: true
persistence: {}

# Autoscaling - disabled by default
autoscaling:
  enabled: false

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""
