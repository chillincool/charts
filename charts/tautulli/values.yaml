# Default values for tautulli
# Most defaults come from the common library chart
# Only override what's specific to this app

# Test flag used by CI to trigger harmless changes for workflow testing
ciTest: true

image:
  registry: ghcr.io
  repository: chillincool/tautulli
  tag: 2.16.0
  pullPolicy: IfNotPresent

# Tautulli listens on port 8181
containerPort: 8181

# Tautulli uses /status for health checks instead of /ping
probes:
  path: /status

service:
  type: ClusterIP
  port: 8181
  targetPort: http

# Ingress - disabled by default
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: tautulli.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Persistence configuration
# User must configure persistence - no defaults provided
# Example:
# persistence:
#   config:
#     enabled: true
#     type: pvc
#     existingClaim: tautulli-config
#     globalMounts:
#       - path: /config
#         subPath: tautulli
persistence: {}

# Autoscaling - disabled by default
autoscaling:
  enabled: false

# Service account
serviceAccount:
  create: true

# Additional settings
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
env: []
envFrom: []
