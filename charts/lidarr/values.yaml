# Default values for lidarr
# Most defaults come from the common library chart
# Only override what's specific to this app

image:
  registry: ghcr.io
  repository: chillincool/lidarr
  tag: latest
  pullPolicy: IfNotPresent

# Lidarr listens on port 8686
containerPort: 8686

service:
  type: ClusterIP
  port: 8686
  targetPort: http

# Ingress - disabled by default
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: lidarr.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Persistence configuration
persistence:
  config:
    enabled: true
    type: emptyDir
    mountPath: /config
  tmp:
    enabled: true
    type: emptyDir
    mountPath: /tmp
    sizeLimit: 1Gi

# Autoscaling - disabled by default
autoscaling:
  enabled: false

# Service account
serviceAccount:
  create: true

# Additional settings
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
env: []
