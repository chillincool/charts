# Default values for sonarr
# Most defaults come from the common library chart
# Only override what's specific to this app

# Test flag used by CI to trigger harmless changes for workflow testing
ciTest: false

image:
  registry: ghcr.io
  repository: chillincool/sonarr
  tag: 4.0.16.2944
  pullPolicy: IfNotPresent

# Sonarr listens on port 8989
containerPort: 8989

service:
  type: ClusterIP
  port: 8989
  targetPort: http

# Override probe path if different from /ping (sonarr uses /ping)
# probes:
#   path: /ping

# Ingress - disabled by default
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sonarr.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Resources - omit to use common.defaultResources
# Uncomment to override:
# resources:
#   requests:
#     cpu: 100m
#     memory: 256Mi
#   limits:
#     cpu: 1
#     memory: 1Gi

# Security contexts - omit to use common defaults (uid/gid 568)
# Uncomment to override:
# securityContext:
#   runAsUser: 1000
# podSecurityContext:
#   fsGroup: 1000

# Persistence configuration
# User must configure persistence - no defaults provided
# Example:
# persistence:
#   config:
#     enabled: true
#     type: pvc
#     existingClaim: sonarr-config
#     globalMounts:
#       - path: /config
#         subPath: sonarr
persistence: {}

# Autoscaling - disabled by default
autoscaling:
  enabled: false

# Service account
serviceAccount:
  create: true

# Additional settings
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
env: []
envFrom: []
