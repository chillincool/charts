# Default values for sonarr
# Most defaults come from the common library chart
# Only override what's specific to this app

image:
  registry: ghcr.io
  repository: chillincool/sonarr
  tag: latest
  pullPolicy: IfNotPresent

# Sonarr listens on port 8989
containerPort: 8989

service:
  type: ClusterIP
  port: 8989
  targetPort: http

# Override probe path if different from /ping (sonarr uses /ping)
# probes:
#   path: /ping

# Ingress - disabled by default
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: sonarr.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Resources - omit to use common.defaultResources
# Uncomment to override:
# resources:
#   requests:
#     cpu: 100m
#     memory: 256Mi
#   limits:
#     cpu: 1
#     memory: 1Gi

# Security contexts - omit to use common defaults (uid/gid 568)
# Uncomment to override:
# securityContext:
#   runAsUser: 1000
# podSecurityContext:
#   fsGroup: 1000

# Persistence configuration
# Supports: pvc, emptyDir, configMap, secret, hostPath, custom
persistence:
  config:
    enabled: true
    type: emptyDir  # Change to 'pvc' for production
    # For PVC:
    # type: pvc
    # existingClaim: ""  # Use existing PVC
    # storageClass: ""
    # size: 1Gi
    # accessMode: ReadWriteOnce
    mountPath: /config
    # subPath: ""
    # readOnly: false

  tmp:
    enabled: true
    type: emptyDir
    mountPath: /tmp
    sizeLimit: 1Gi

  # Example: Multiple mounts from same PVC using globalMounts
  # media:
  #   enabled: true
  #   type: pvc
  #   existingClaim: media-storage
  #   globalMounts:
  #     - path: /media/movies
  #       subPath: movies
  #     - path: /media/tv
  #       subPath: tv
  #       readOnly: false

  # Example: NFS mount
  # nfs:
  #   enabled: false
  #   type: custom
  #   mountPath: /mnt/nfs
  #   volumeSpec:
  #     nfs:
  #       server: 192.168.1.100
  #       path: /export/media

# Legacy volume/volumeMount support (optional - use persistence instead)
volumes: []
volumeMounts: []

# Autoscaling - disabled by default
autoscaling:
  enabled: false

# Service account
serviceAccount:
  create: true

# Additional settings
nameOverride: ""
fullnameOverride: ""
imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
env: []
