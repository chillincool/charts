# Default values for huntarr
replicaCount: 1

image:
  registry: ghcr.io
  repository: chillincool/huntarr
  # tag defaults to appVersion from Chart.yaml if not specified
  tag: 8.2.10
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # Uses common.defaultPodSecurityContext if not specified
  # fsGroup: 568

securityContext: {}
  # Uses common.defaultSecurityContext if not specified
  # runAsNonRoot: true
  # runAsUser: 568
  # runAsGroup: 568
  # readOnlyRootFilesystem: true

containerPort: 8080

service:
  type: ClusterIP
  port: 8080
  targetPort: http

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: huntarr.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}
  # Uses common.defaultResources if not specified
  # limits:
  #   cpu: 1000m
  #   memory: 1Gi
  # requests:
  #   cpu: 10m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80

probes: {}
  # Uses common.livenessProbe and common.readinessProbe defaults if not specified
  # path: /ping

# Environment variables
env:
  - name: HUNTARR_PORT
    value: "8080"
envFrom: []

# Persistence configuration
# User must configure persistence - no defaults provided
# Example:
# persistence:
#   config:
#     enabled: true
#     type: pvc
#     existingClaim: huntarr-config
#     globalMounts:
#       - path: /config
persistence: {}

nodeSelector: {}

tolerations: []

affinity: {}

# Test flag used by CI to trigger harmless changes for workflow testing
ciTest: false
