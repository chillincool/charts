# Default values for suggestarr
# Most defaults come from the common library chart
# Only override what's specific to this app

image:
  registry: ghcr.io
  repository: chillincool/suggestarr
  tag: v1.0.20
  pullPolicy: IfNotPresent

# Suggestarr listens on port 5000
containerPort: 5000

service:
  type: ClusterIP
  port: 5000
  targetPort: http

# Ingress - disabled by default
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: suggestarr.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Resources - omit to use common.defaultResources
# Uncomment to override:
# resources:
#   requests:
#     cpu: 100m
#     memory: 256Mi
#   limits:
#     cpu: 1
#     memory: 1Gi

# Security contexts - omit to use common defaults (uid/gid 568)
# Uncomment to override:
# securityContext:
#   runAsUser: 1000
# podSecurityContext:
#   fsGroup: 1000

# Persistence configuration
# User must configure persistence - no defaults provided
# Example:
# persistence:
#   config:
#     enabled: true
#     type: pvc
#     existingClaim: suggestarr-config
#     globalMounts:
#       - path: /config
persistence: {}

# Autoscaling - disabled by default
autoscaling:
  enabled: false

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""
