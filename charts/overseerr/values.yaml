# Default values for overseerr
# Most defaults come from the common library chart
# Only override what's specific to this app

image:
  registry: ghcr.io
  repository: chillincool/overseerr
  tag: v1.34.0
  pullPolicy: IfNotPresent

# Overseerr listens on port 5055
containerPort: 5055

service:
  type: ClusterIP
  port: 5055
  targetPort: http

# Overseerr uses /api/v1/status for health checks
probes:
  path: /api/v1/status

# Ingress - disabled by default
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: overseerr.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Resources - use streaming defaults from common
# Uncomment to override:
# resources:
#   requests:
#     cpu: 100m
#     memory: 256Mi
#   limits:
#     cpu: 2
#     memory: 2Gi

# Security contexts - omit to use common defaults (uid/gid 568)
# Uncomment to override:
# securityContext:
#   runAsUser: 1000
# podSecurityContext:
#   fsGroup: 1000

# Persistence configuration
# User must configure persistence - no defaults provided
# Example:
# persistence:
#   config:
#     enabled: true
#     type: pvc
#     existingClaim: overseerr-config
#     globalMounts:
#       - path: /app/config
persistence: {}

# Autoscaling - disabled by default
autoscaling:
  enabled: false

# Service account
serviceAccount:
  create: true
  annotations: {}
  name: ""

ciTest: false
