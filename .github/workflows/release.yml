name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - charts/**
      - .github/workflows/release.yml
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run chart-testing (lint)
        run: ct lint --target-branch ${{ github.event.repository.default_branch }}

  release:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          # Install jq for JSON parsing used by PR creation checks
          # Download jq binary directly (no sudo required on GitHub hosted runners)
          curl -sSL -o /usr/local/bin/jq https://github.com/stedolan/jq/releases/latest/download/jq-linux64
          chmod +x /usr/local/bin/jq

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Detect Changed Charts
        id: changed
        run: |
          # Prevent loops — skip if last commit authored by bot or looks like an auto-bump/dependency update
          last_author=$(git log -1 --pretty=format:'%an' || echo "")
          last_msg=$(git log -1 --pretty=format:'%s' || echo "")
          if [[ "$last_author" == "github-actions[bot]" ]] || [[ "$last_msg" == *"auto-bump"* ]] || [[ "$last_msg" == *"chore(deps): update dependent charts"* ]]; then
            echo "Skipping: last commit authored by bot or auto-bump/dependency-update message - $last_author: $last_msg"
            echo "changed=" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get list of changed files (skip if commit message contains [skip ci])
          changed_files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          
          echo "Changed files:"
          echo "$changed_files"
          
          # Find unique chart directories that changed
          changed_charts=""
          for file in $changed_files; do
            if [[ $file == charts/* ]]; then
              chart_dir=$(echo "$file" | cut -d'/' -f2)
              if [[ -f "charts/$chart_dir/Chart.yaml" ]]; then
                # Don't add duplicates
                if ! echo "$changed_charts" | grep -qw "$chart_dir"; then
                  changed_charts="$changed_charts $chart_dir"
                fi
              fi
            fi
          done
          
          # Trim whitespace
          changed_charts=$(echo "$changed_charts" | xargs)
          
          echo "changed=$changed_charts" >> $GITHUB_OUTPUT
          echo "Changed charts: '$changed_charts'"

      - name: Bump Versions and Create Combined PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          changed_charts="${{ steps.changed.outputs.changed }}"

          # Trim whitespace
          changed_charts=$(echo "$changed_charts" | xargs)

          # If no changed charts detected, exit early
          if [[ -z "$changed_charts" ]]; then
            echo "No chart changes detected - nothing to publish"
            exit 0
          fi

          # Process common chart first if it's in the list
          common_new_version=""
          if echo "$changed_charts" | grep -q "common"; then
            echo "Processing common chart first..."
            chart="charts/common"
            current_version=$(yq eval '.version' "$chart/Chart.yaml")
            echo "Common current version: $current_version"

            IFS='.' read -r major minor patch <<< "$current_version"
            new_patch=$((patch + 1))
            new_version="${major}.${minor}.${new_patch}"
            common_new_version="$new_version"
            echo "Common new version: $new_version"

            yq eval ".version = \"$new_version\"" -i "$chart/Chart.yaml"

            # Remove common from the list so we don't process it again
            changed_charts=$(echo "$changed_charts" | sed 's/common//')

            # If common changed, add all dependent charts to the list
            echo "Common changed - adding all dependent charts to update list"
            for app_chart in charts/*/Chart.yaml; do
              if [[ "$app_chart" == "charts/common/Chart.yaml" ]]; then
                continue
              fi
              chart_name=$(basename $(dirname "$app_chart"))
              # Only add if not already in the list
              if ! echo "$changed_charts" | grep -qw "$chart_name"; then
                changed_charts="$changed_charts $chart_name"
              fi
            done
            changed_charts=$(echo "$changed_charts" | xargs)
            echo "Updated changed_charts list: $changed_charts"
          fi

          # Collect all chart updates
          chart_updates=""
          updated_files=""

          # Process all charts and collect updates
          for chart_name in $changed_charts; do
            # Skip empty strings
            if [[ -z "$chart_name" ]]; then
              continue
            fi

            chart="charts/$chart_name"

            if [[ ! -f "$chart/Chart.yaml" ]]; then
              echo "Skipping $chart_name - not a valid chart"
              continue
            fi

            echo "Processing chart: $chart_name"

            # Get current version
            current_version=$(yq eval '.version' "$chart/Chart.yaml")
            echo "Current version: $current_version"

            # Parse version (assumes semver: major.minor.patch)
            IFS='.' read -r major minor patch <<< "$current_version"

            # Increment patch version
            new_patch=$((patch + 1))
            new_version="${major}.${minor}.${new_patch}"

            echo "New version: $new_version"

            # Update Chart.yaml with new version
            yq eval ".version = \"$new_version\"" -i "$chart/Chart.yaml"

            # Update common dependency if common was bumped
            if [[ -n "$common_new_version" ]]; then
              if yq eval '.dependencies[] | select(.name == "common")' "$chart/Chart.yaml" > /dev/null 2>&1; then
                yq eval "(.dependencies[] | select(.name == \"common\") | .version) = \"$common_new_version\"" -i "$chart/Chart.yaml"
              fi
            fi

            # Update dependencies
            helm dependency update "$chart"

            # Track this update
            chart_updates="$chart_updates $chart_name:$new_version"
            updated_files="$updated_files $chart/Chart.yaml"
          done

          # Trim whitespace
          chart_updates=$(echo "$chart_updates" | xargs)
          updated_files=$(echo "$updated_files" | xargs)

          # If we have updates, create a single combined PR
          if [[ -n "$chart_updates" ]]; then
            # Create a single branch for all updates
            timestamp=$(date +%s)
            branch_name="auto-bump/charts-${timestamp}"

            git checkout -b "$branch_name"
            git add $updated_files

            # Add common if it was updated
            if [[ -n "$common_new_version" ]]; then
              git add charts/common/Chart.yaml
              chart_updates="common:$common_new_version $chart_updates"
            fi

            # Create commit message listing all updates
            commit_msg="chore: auto-bump chart versions\n\nUpdated charts:\n"
            for update in $chart_updates; do
              commit_msg="${commit_msg}- ${update}\n"
            done

            git commit -m "$(echo -e "$commit_msg")"
            git push origin HEAD:$branch_name

            # Create PR title and body
            chart_count=$(echo "$chart_updates" | wc -w | xargs)
            if [[ "$chart_count" -eq 1 ]]; then
              first_chart=$(echo "$chart_updates" | cut -d' ' -f1 | cut -d':' -f1)
              first_version=$(echo "$chart_updates" | cut -d' ' -f1 | cut -d':' -f2)
              pr_title="chore: auto-bump ${first_chart} to ${first_version}"
            else
              pr_title="chore: auto-bump ${chart_count} charts"
            fi

            pr_body="This automated PR updates the following charts:\n\n"
            for update in $chart_updates; do
              chart_name=$(echo "$update" | cut -d':' -f1)
              version=$(echo "$update" | cut -d':' -f2)
              pr_body="${pr_body}- ${chart_name}: ${version}\n"
            done
            pr_body="${pr_body}\nCI will run and publishing will occur after merge."

            # Check if PR already exists
            existing_pr=$(curl -sS -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:${branch_name}&state=open" | jq '. | length' 2>/dev/null || echo 0)

            if [[ "$existing_pr" -eq 0 ]]; then
              echo "Creating PR: $pr_title"
              resp=$(curl -sS -w "%{http_code}" -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
                -d "{\"title\":\"${pr_title}\",\"head\":\"${branch_name}\",\"base\":\"main\",\"body\":\"${pr_body}\"}" \
                "https://api.github.com/repos/${{ github.repository }}/pulls") || true

              http_code=$(echo "$resp" | tail -c 4)
              body=$(echo "$resp" | sed -e 's/.\{3\}$//')
              echo "PR API response code: $http_code"
              if [[ "$http_code" == "201" ]]; then
                echo "PR created successfully"
              else
                echo "PR creation failed: $body"
              fi
            else
              echo "PR for $branch_name already exists (count=$existing_pr), skipping"
            fi
          else
            echo "No charts to update"
          fi

      - name: Delete merged branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "PR head branch: $HEAD_REF"
          if [[ -n "$HEAD_REF" ]]; then
            if [[ "$HEAD_REF" == auto-bump/* ]] || [[ "$HEAD_REF" == auto-update-dependents/* ]]; then
              echo "Deleting remote branch: $HEAD_REF"
              encoded_head_ref=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$HEAD_REF")
              gh api "repos/${{ github.repository }}/git/refs/heads/$encoded_head_ref" -X DELETE || echo "Branch deletion failed or branch already deleted"
            else
              echo "Skipping remote branch delete; head ref '$HEAD_REF' does not match auto-bump/auto-update pattern"
            fi
          else
            echo "No HEAD_REF found for this PR"
          fi

          # End of bump job — no branch deletion here (deletion happens after successful publish-on-merge)

      - name: Logout from GitHub Container Registry
        if: always()
        run: |
          helm registry logout ghcr.io

  publish-on-merge:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Authenticate to GHCR for publishing
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          set -e
          echo "Attempting login to ghcr.io with GITHUB_TOKEN (actor: $GITHUB_ACTOR)"
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null 2>&1
          echo "Authenticated with GITHUB_TOKEN"

      - name: Package and publish charts from merged PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number }}
          echo "PR_NUMBER=$PR_NUMBER"

          # Get files changed in PR
          files=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER/files" | jq -r '.[].filename')
          echo "Files in PR:\n$files"

          CHARTS_DIR=$(mktemp -d)
          common_published=false
          common_version=""
          for f in $files; do
            if [[ $f == charts/*/Chart.yaml ]]; then
              chart_dir=$(echo "$f" | cut -d'/' -f2)
              chart_path="charts/$chart_dir"
              echo "Packaging $chart_dir"
              current_version=$(yq eval '.version' "$chart_path/Chart.yaml")
              echo "Ensuring dependencies for $chart_dir"
              helm dependency update "$chart_path" || { echo "helm dependency update failed for $chart_dir"; exit 1; }
              echo "version: $current_version"
              helm package "$chart_path" -d "$CHARTS_DIR"
              # Try pushing with retries
              for i in 1 2 3; do
                if helm push "${CHARTS_DIR}/${chart_dir}-${current_version}.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts; then
                  echo "Pushed ${chart_dir}:${current_version}"
                  break
                else
                  echo "Push attempt $i failed, retrying..."
                  sleep 2
                fi
              done
              tag_name="${chart_dir}-${current_version}"
              if ! git rev-parse "$tag_name" >/dev/null 2>&1; then
                git tag "$tag_name"
                git push origin "$tag_name"
                echo "Created tag: $tag_name"
              else
                echo "Tag $tag_name already exists, skipping"
              fi
              # remember if common was published
              if [[ "$chart_dir" == "common" ]]; then
                common_published=true
                common_version="$current_version"
              fi
            fi
          done

          # If we published common, create bump PRs for dependent charts
          if [[ "$common_published" == true ]] && [[ -n "$common_version" ]]; then
            echo "common_published=$common_published, common_version=$common_version"
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            for app_chart in charts/*/Chart.yaml; do
              if [[ "$app_chart" == "charts/common/Chart.yaml" ]]; then
                continue
              fi
              echo "Checking $app_chart for common dependency"
              if yq eval '.dependencies[] | select(.name == "common")' "$app_chart" > /dev/null 2>&1; then
                dep_ver=$(yq eval '.dependencies[] | select(.name == "common") | .version' "$app_chart")
                echo "Current dep_ver=$dep_ver for $app_chart"
                if [[ "$dep_ver" != "$common_version" ]]; then
                  echo "Updating $app_chart common dependency: $dep_ver -> $common_version"
                  yq eval "(.dependencies[] | select(.name == \"common\") | .version) = \"$common_version\"" -i "$app_chart"
                  
                  # Bump the dependent's version
                  current_ver=$(yq eval '.version' "$app_chart")
                  IFS='.' read -r major minor patch <<< "$current_ver"
                  new_patch=$((patch + 1))
                  new_ver="${major}.${minor}.${new_patch}"
                  echo "Bumping $app_chart version: $current_ver -> $new_ver"
                  yq eval ".version = \"$new_ver\"" -i "$app_chart"
                  
                  # Create branch and PR
                  chart_name=$(basename "$app_chart" .yaml)
                  branch_name="auto-bump/${chart_name}-${new_ver}"
                  git checkout -b "$branch_name"
                  git add "$app_chart"
                  git commit -m "chore: auto-bump ${chart_name} to ${new_ver} for common ${common_version}"
                  git push origin HEAD:$branch_name
                  
                  pr_title="chore: auto-bump ${chart_name} to ${new_ver}"
                  pr_body="Automated PR to bump ${chart_name} for common ${common_version} update."
                  existing_pr=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                    "https://api.github.com/repos/${{ github.repository }}/pulls?head=${{ github.repository_owner }}:${branch_name}&state=open" | jq '. | length')
                  if [[ "$existing_pr" -eq 0 ]]; then
                    curl -s -X POST -H "Authorization: token $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
                      -d "{\"title\":\"${pr_title}\",\"head\":\"${branch_name}\",\"base\":\"main\",\"body\":\"${pr_body}\"}" \
                      "https://api.github.com/repos/${{ github.repository }}/pulls" || echo "Failed to create PR for $chart_name"
                  else
                    echo "PR for $branch_name already exists, skipping"
                  fi
                  
                  git checkout main
                fi
              fi
            done
          fi

          rm -rf "$CHARTS_DIR"
