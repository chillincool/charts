name: Release Charts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run chart-testing (lint)
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --all

  release:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Install yq
        run: |
          wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          chmod +x /usr/local/bin/yq

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Detect Changed Charts
        id: changed
        run: |
          # Get list of changed files (skip if commit message contains [skip ci])
          changed_files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "")
          
          echo "Changed files:"
          echo "$changed_files"
          
          # Find unique chart directories that changed
          changed_charts=""
          for file in $changed_files; do
            if [[ $file == charts/* ]]; then
              chart_dir=$(echo "$file" | cut -d'/' -f2)
              if [[ -f "charts/$chart_dir/Chart.yaml" ]]; then
                # Don't add duplicates
                if ! echo "$changed_charts" | grep -qw "$chart_dir"; then
                  changed_charts="$changed_charts $chart_dir"
                fi
              fi
            fi
          done
          
          # Trim whitespace
          changed_charts=$(echo "$changed_charts" | xargs)
          
          echo "changed=$changed_charts" >> $GITHUB_OUTPUT
          echo "Changed charts: '$changed_charts'"

      - name: Bump Versions and Package Charts
        run: |
          changed_charts="${{ steps.changed.outputs.changed }}"
          
          # Trim whitespace
          changed_charts=$(echo "$changed_charts" | xargs)
          
          # If no changed charts detected, exit early (don't process all)
          if [[ -z "$changed_charts" ]]; then
            echo "No chart changes detected - nothing to publish"
            exit 0
          fi
          
          CHARTS_DIR=$(mktemp -d)
          
          # Process common chart first if it's in the list
          if echo "$changed_charts" | grep -q "common"; then
            echo "Processing common chart first..."
            chart="charts/common"
            current_version=$(yq eval '.version' "$chart/Chart.yaml")
            echo "Common current version: $current_version"
            
            IFS='.' read -r major minor patch <<< "$current_version"
            new_patch=$((patch + 1))
            new_version="${major}.${minor}.${new_patch}"
            echo "Common new version: $new_version"
            
            yq eval ".version = \"$new_version\"" -i "$chart/Chart.yaml"
            
            helm package "$chart" -d "$CHARTS_DIR"
            helm push "${CHARTS_DIR}/common-${new_version}.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts
            echo "Successfully pushed common:${new_version} to GHCR"
            
            tag_name="common-${new_version}"
            if ! git rev-parse "$tag_name" >/dev/null 2>&1; then
              git tag "$tag_name"
              git push origin "$tag_name"
              echo "Created tag: $tag_name"
            else
              echo "Tag $tag_name already exists, skipping"
            fi
            
            # Update all app charts to use new common version
            for app_chart in charts/*/Chart.yaml; do
              if [[ "$app_chart" == "charts/common/Chart.yaml" ]]; then
                continue
              fi
              
              # Update common dependency version if it exists
              if yq eval '.dependencies[] | select(.name == "common")' "$app_chart" > /dev/null 2>&1; then
                echo "Updating common dependency in $app_chart to $new_version"
                yq eval "(.dependencies[] | select(.name == \"common\") | .version) = \"$new_version\"" -i "$app_chart"
              fi
            done
            
            # Remove common from the list so we don't process it again
            changed_charts=$(echo "$changed_charts" | sed 's/common//')
          fi
          
          # Now process all other charts
          for chart_name in $changed_charts; do
            # Skip empty strings
            if [[ -z "$chart_name" ]]; then
              continue
            fi
            
            chart="charts/$chart_name"
            
            if [[ ! -f "$chart/Chart.yaml" ]]; then
              echo "Skipping $chart_name - not a valid chart"
              continue
            fi
            
            echo "Processing chart: $chart_name"
            
            # Get current version
            current_version=$(yq eval '.version' "$chart/Chart.yaml")
            echo "Current version: $current_version"
            
            # Parse version (assumes semver: major.minor.patch)
            IFS='.' read -r major minor patch <<< "$current_version"
            
            # Increment patch version
            new_patch=$((patch + 1))
            new_version="${major}.${minor}.${new_patch}"
            
            echo "New version: $new_version"
            
            # Update Chart.yaml with new version
            yq eval ".version = \"$new_version\"" -i "$chart/Chart.yaml"
            
            # Update dependencies
            helm dependency update "$chart"
            
            # Package the chart
            helm package "$chart" -d "$CHARTS_DIR"
            
            # Push to GHCR
            helm push "${CHARTS_DIR}/${chart_name}-${new_version}.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts
            
            echo "Successfully pushed ${chart_name}:${new_version} to GHCR"
            
            # Create and push git tag
            tag_name="${chart_name}-${new_version}"
            if ! git rev-parse "$tag_name" >/dev/null 2>&1; then
              git tag "$tag_name"
              git push origin "$tag_name"
              echo "Created tag: $tag_name"
            else
              echo "Tag $tag_name already exists, skipping"
            fi
          done
          
          # Commit version bumps back to repo
          if git diff --quiet; then
            echo "No version changes to commit"
          else
            git add charts/*/Chart.yaml
            git commit -m "chore: auto-bump chart versions [skip ci]"
            git push origin main
          fi
          
          rm -rf "$CHARTS_DIR"

      - name: Logout from GitHub Container Registry
        if: always()
        run: |
          helm registry logout ghcr.io
