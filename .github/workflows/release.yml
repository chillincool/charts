name: Release Charts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run chart-testing (lint)
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --all

  release:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and Push Charts
        run: |
          # Create temporary directory for packaged charts
          CHARTS_DIR=$(mktemp -d)
          
          for chart in charts/*/; do
            chart_name=$(basename "$chart")
            # Skip if not a valid chart directory
            if [[ ! -f "$chart/Chart.yaml" ]]; then
              echo "Skipping $chart_name - not a valid chart"
              continue
            fi
            
            echo "Processing chart: $chart_name"
            
            # Update dependencies
            helm dependency update "$chart"
            
            # Package the chart
            helm package "$chart" -d "$CHARTS_DIR"
            
            # Get chart version using helm show chart
            chart_version=$(helm show chart "$chart" | grep '^version:' | awk '{print $2}')
            
            # Push to GHCR
            helm push "${CHARTS_DIR}/${chart_name}-${chart_version}.tgz" oci://ghcr.io/${{ github.repository_owner }}/charts
            
            echo "Successfully pushed ${chart_name}:${chart_version} to GHCR"
          done
          
          # Cleanup temporary directory
          rm -rf "$CHARTS_DIR"

      - name: Logout from GitHub Container Registry
        if: always()
        run: |
          helm registry logout ghcr.io
